name: Sync sitemap from whatsnext.buzz
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live sitemap
        run: |
          curl -fsS --retry 3 -o sitemap.new https://whatsnext.buzz/sitemap.xml
          grep -q "<urlset" sitemap.new
          if ! cmp -s sitemap.new sitemap.xml; then mv sitemap.new sitemap.xml; echo changed=1 >> "$GITHUB_ENV"; else rm sitemap.new; fi
      - name: Commit if changed
        if: env.changed == '1'
        run: |
          git config user.name "sitemap-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "sync sitemap $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
